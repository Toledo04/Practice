services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"

  redis:
    build: ./docker_images/redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vite:
    profiles: ["vite"]
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontendapp
      - /frontendapp/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

  nginx:
    profiles: ["nginx"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  redis_data:
