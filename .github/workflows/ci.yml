name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend style
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t jaarvi-api:test .
      - name: Start API container
        run: docker run -d --name jaarvi-api-test -p 8000:8000 jaarvi-api:test
      - name: Integration test the running API
        run: |
          for attempt in $(seq 1 20); do
            if response=$(curl --fail --silent http://localhost:8000/health); then
              if [ "$response" = '{"status":"ok"}' ]; then
                echo "Container returned the expected health response."
                exit 0
              fi
              echo "Unexpected health response: $response" >&2
              exit 1
            fi
            sleep 1
          done
          docker logs jaarvi-api-test
          exit 1
      - name: Stop API container
        if: always()
        run: docker rm --force jaarvi-api-test
