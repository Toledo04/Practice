[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "jaarvi-learning-app"
version = "0.1.0"
description = "A small web app built while learning software engineering fundamentals."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[tool.poetry]
packages = [{ include = "jaarvi_app" }]

[tool.poetry.group.test.dependencies]
httpx2 = "*"
pytest = ">=8.0,<9.0"
pytest-cov = ">=6.0,<8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
